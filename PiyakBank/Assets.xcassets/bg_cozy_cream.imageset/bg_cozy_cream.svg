<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="1" stop-color="#FFF1DA"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E2C2"/>
      <stop offset="1" stop-color="#EAD3AC"/>
    </linearGradient>
  </defs>

  <!-- 벽 -->
  <rect x="0" y="0" width="1024" height="724" fill="url(#wall)"/>
  <!-- 도트 패턴 -->
  <g fill="#FFE9C9" opacity="0.7">
    <circle cx="140" cy="160" r="10"/><circle cx="360" cy="120" r="8"/>
    <circle cx="620" cy="150" r="9"/><circle cx="880" cy="130" r="8"/>
    <circle cx="240" cy="320" r="8"/><circle cx="520" cy="300" r="10"/>
    <circle cx="780" cy="330" r="8"/><circle cx="120" cy="480" r="9"/>
    <circle cx="900" cy="470" r="9"/>
  </g>
  <!-- 바닥 -->
  <rect x="0" y="700" width="1024" height="324" fill="url(#floor)"/>
  <!-- 걸레받이 -->
  <rect x="0" y="690" width="1024" height="16" fill="#E2C595"/>
  <!-- 바닥 결 -->
  <g stroke="#E0C58F" stroke-width="3" opacity="0.5">
    <line x1="0" y1="800" x2="1024" y2="800"/>
    <line x1="0" y1="900" x2="1024" y2="900"/>
  </g>
</svg>
