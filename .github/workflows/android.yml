name: Validate Android and Wear OS
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'PiyakBank/Views/PiyakScene.swift', 'PiyakBank/Shared/PiyakActivityPlan.swift', 'PiyakBank/Views/PiyakBehavior.swift']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'PiyakBank/Views/PiyakScene.swift', 'PiyakBank/Shared/PiyakActivityPlan.swift', 'PiyakBank/Views/PiyakBehavior.swift']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    name: Android tests, lint, and release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify original catalog and scene meshes
        run: |
          python3 core/verify_catalog.py
          python3 scripts/check_scene_assets.py
      - name: Tests, lint, phone and watch release bundles
        run: ./gradlew --no-daemon --max-workers=2 :core:test :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintRelease :wear:lintRelease :app:assembleDebug :wear:assembleDebug :app:bundleRelease :wear:bundleRelease
      - name: Compile isolated device UI tests
        run: ./gradlew --no-daemon --max-workers=2 -PpiyakUiTest=true :app:assembleUiTest :app:assembleUiTestAndroidTest :wear:assembleDebugAndroidTest
      - name: Verify 16 KB native library alignment
        run: python3 scripts/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk wear/build/outputs/apk/debug/wear-debug.apk app/build/outputs/bundle/release/app-release.aab wear/build/outputs/bundle/release/wear-release.aab
      - name: Save test reports and installable debug builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piyak-android-validation
          if-no-files-found: warn
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/
            android/wear/build/reports/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/uiTest/*.apk
            android/app/build/outputs/apk/androidTest/uiTest/*.apk
            android/wear/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/wear/build/outputs/bundle/release/*.aab
  minimum-api-instrumentation:
    name: Phone API 26 SQLite, export, UI, and GPU regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile isolated phone tests before starting emulator
        run: ./gradlew --no-daemon --max-workers=2 -PpiyakUiTest=true :app:assembleUiTest :app:assembleUiTestAndroidTest
      # KVM setup follows https://github.com/ReactiveCircus/android-emulator-runner .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger queues the permission update; wait before checking the device.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run on the actual minimum supported Android version
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android
          script: bash scripts/run_phone_instrumentation_ci.sh
      - name: Save minimum API test output and generated GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piyak-phone-api26-instrumentation
          if-no-files-found: warn
          retention-days: 14
          path: android/app/build/reports/minimum-api26/
